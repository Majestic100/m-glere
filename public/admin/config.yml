# Decap CMS. Redigér mæglere, postnumre, priser, bysider og firmaoplysninger uden kode.
# Hver gemning bliver et commit i GitHub, og Netlify bygger siden igen (ca. 1 minut).
# Login: GitHub-konto med skriveadgang til repoet. Se README, afsnittet "CMS".
backend:
  name: github
  repo: majestic100/m-glere
  branch: main
  commit_messages:
    update: 'CMS: opdater {{collection}} "{{slug}}"'
    create: 'CMS: opret {{collection}} "{{slug}}"'

locale: da
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: maeglere
    label: Mæglere
    files:
      - name: maeglere
        label: Partnermæglere
        file: src/data/maeglere.json
        fields:
          - name: maeglere
            label: Mæglere
            widget: list
            summary: '{{fields.navn}}, {{fields.butik}}'
            fields:
              - { name: id, label: 'Id (små bogstaver, uden mellemrum, ændres aldrig)', widget: string, pattern: ['^[a-z0-9-]+$', 'Kun a-z, 0-9 og bindestreg'] }
              - { name: aktiv, label: Aktiv, widget: boolean, default: true, hint: 'Slå fra for at skjule mægleren uden at slette den' }
              - { name: pladsholder, label: 'Eksempeldata', widget: boolean, default: false }
              - { name: navn, label: Navn, widget: string }
              - { name: titel, label: Titel, widget: string, hint: 'Fx Statsautoriseret ejendomsmægler' }
              - { name: butik, label: 'Butik og by', widget: string, hint: 'Fx home Aarhus C. Står i samtykketeksten.' }
              - { name: omraade, label: 'Område (kort tekst)', widget: string, hint: 'Fx Aarhus C og omegn' }
              - { name: postnumre, label: Postnumre, widget: list, field: { name: postnr, label: Postnummer, widget: string, pattern: ['^\d{4}$', 'Fire cifre'] } }
              - { name: billede, label: 'Portræt (kvadratisk, mindst 400 px)', widget: image, required: false }
              - { name: video, label: 'Video (mp4, under 10 MB)', widget: file, required: false }
              - { name: videoPoster, label: 'Videoens forsidebillede', widget: image, required: false }
              - { name: beskrivelse, label: 'Kort beskrivelse (højst 2 linjer)', widget: text }
              - { name: solgte, label: 'Antal solgte boliger i området', widget: number, value_type: int, required: false }
              - { name: solgtePeriode, label: 'Periode for antal solgte', widget: string, default: 'seneste 12 mdr.' }
              - { name: solgteKilde, label: 'Kilde for antal solgte', widget: string }
              - { name: bedoemmelse, label: 'Bedømmelse (fx 4.8)', widget: number, value_type: float, min: 0, max: 5, required: false }
              - { name: bedoemmelseAntal, label: 'Antal anmeldelser', widget: number, value_type: int, required: false }
              - { name: bedoemmelseKilde, label: 'Kilde for bedømmelse', widget: string }

  - name: priser
    label: Kvadratmeterpriser
    files:
      - name: kvmpriser
        label: Kvadratmeterpriser pr. postnummer
        file: src/data/kvmpriser.json
        fields:
          - { name: pladsholder, label: 'Testtal (vises som "Testtal" på siden)', widget: boolean }
          - { name: kilde, label: Kilde, widget: string }
          - { name: opdateret, label: Opdateret, widget: string }
          - { name: note, label: Note, widget: text, required: false }
          - name: priser
            label: 'Priser pr. postnummer (kr. pr. m²). Tomt felt = intet estimat for den boligtype.'
            widget: list
            summary: '{{fields.postnr}}'
            fields:
              - { name: postnr, label: Postnummer, widget: string, pattern: ['^\d{4}$', 'Fire cifre'] }
              - { name: villa, label: Villa, widget: number, value_type: int, required: false }
              - { name: raekkehus, label: Rækkehus, widget: number, value_type: int, required: false }
              - { name: ejerlejlighed, label: Ejerlejlighed, widget: number, value_type: int, required: false }
              - { name: sommerhus, label: Sommerhus, widget: number, value_type: int, required: false }
              - { name: landejendom, label: Landejendom, widget: number, value_type: int, required: false }

  - name: byer
    label: Bysider
    folder: src/content/byer
    extension: json
    format: json
    create: true
    slug: '{{fields.slug}}'
    identifier_field: by
    fields:
      - { name: by, label: By, widget: string }
      - { name: slug, label: 'Adresse (fx aarhus giver /hvad-er-min-bolig-vaerd-i-aarhus)', widget: string, pattern: ['^[a-z0-9-]+$', 'Kun a-z, 0-9 og bindestreg'] }
      - { name: billede, label: Billede, widget: select, options: [parcelhus, raekkehuse, etageejendom, aarhus-gade] }
      - { name: postnumre, label: Postnumre, widget: list, field: { name: postnr, label: Postnummer, widget: string } }
      - { name: intro, label: 'Intro (valgfri)', widget: text, required: false }
      - name: prisudvikling
        label: Prisudvikling
        widget: object
        fields:
          - { name: pladsholder, label: Pladsholder, widget: boolean, default: true }
          - { name: tekst, label: Tekst, widget: text }
          - { name: kilde, label: Kilde, widget: string }
          - name: punkter
            label: 'Tal (vises som tabel)'
            widget: list
            required: false
            fields:
              - { name: periode, label: 'Periode (fx 3. kvt. 2026)', widget: string }
              - { name: kvmpris, label: 'Kr. pr. m²', widget: number, value_type: int }

  - name: indstillinger
    label: Indstillinger
    files:
      - name: site
        label: Firma, åbningstider og beregner
        file: src/data/site.json
        fields:
          - { name: navn, label: Navn, widget: string }
          - { name: selskab, label: Selskab, widget: string }
          - { name: cvr, label: CVR, widget: string }
          - { name: adresse, label: Adresse, widget: string }
          - { name: postnrBy, label: 'Postnr. og by', widget: string }
          - { name: telefon, label: Telefon, widget: string }
          - { name: email, label: E-mail, widget: string }
          - { name: heroMediaUrl, label: 'Link til Hero Media', widget: string }
          - { name: trustpilotUrl, label: 'Link til Trustpilot (tom = pladsholder)', widget: string, required: false }
          - { name: samtykkeVersion, label: 'Samtykkeversion (ret ved ændring af samtykketekst)', widget: string }
          - name: aabningstider
            label: 'Åbningstider (styrer løftet om opkald inden for 15 min.)'
            widget: object
            fields:
              - { name: pladsholder, label: Pladsholder, widget: boolean }
              - { name: note, label: Note, widget: text, required: false }
              - { name: dage, label: 'Dage (1 = mandag, 7 = søndag)', widget: list, field: { name: dag, label: Dag, widget: number, value_type: int } }
              - { name: fra, label: 'Fra (tt:mm)', widget: string }
              - { name: til, label: 'Til (tt:mm)', widget: string }
          - name: beregner
            label: Provenu-beregner
            widget: object
            fields:
              - { name: pladsholder, label: Pladsholder, widget: boolean }
              - { name: note, label: Note, widget: text, required: false }
              - { name: standardOmkostninger, label: 'Standard salær og omkostninger (kr.)', widget: number, value_type: int }
          - name: estimat
            label: Estimat
            widget: object
            fields:
              - { name: spaend, label: 'Spænd (0.1 = plus/minus 10 %)', widget: number, value_type: float }
              - { name: afrund, label: 'Afrund til nærmeste (kr.)', widget: number, value_type: int }
          - name: team
            label: Holdet bag
            widget: list
            fields:
              - { name: navn, label: Navn, widget: string }
              - { name: rolle, label: Rolle, widget: string }
              - { name: billede, label: Portræt, widget: image, required: false }
              - { name: tekst, label: Tekst, widget: text }
