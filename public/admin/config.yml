# Decap CMS. Redigér mæglere, priser, kommuner, markedstal, vægte og firmaoplysninger uden kode.
# Hver gemning bliver et commit i GitHub, og siden bygges igen (ca. 1 minut).
# Login: GitHub-konto med skriveadgang til repoet. Se README, afsnittet "CMS".
# Felter, der mangler tal, skrives som TODO_DATA. Se TODO_DATA.md.
backend:
  name: github
  repo: majestic100/m-glere
  branch: main
  commit_messages:
    update: 'CMS: opdater {{collection}} "{{slug}}"'
    create: 'CMS: opret {{collection}} "{{slug}}"'

locale: da
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: maeglere
    label: Partnermæglere
    files:
      - name: maeglere
        label: Partnermæglere
        file: data/maeglere.json
        fields:
          - name: maeglere
            label: Mæglere
            widget: list
            summary: '{{fields.navn}}, {{fields.firma}}'
            fields:
              - { name: id, label: 'Id (små bogstaver, ændres aldrig)', widget: string, pattern: ['^[a-z0-9-]+$', 'Kun a-z, 0-9 og bindestreg'] }
              - { name: aktiv, label: 'Aktiv (slå fra for at sætte på pause)', widget: boolean, default: true }
              - { name: navn, label: Navn, widget: string }
              - { name: firma, label: Firma, widget: string, hint: 'Står i samtykketeksten' }
              - { name: by, label: By, widget: string }
              - { name: foto, label: 'Portræt (kvadratisk)', widget: image, required: false }
              - { name: postnumre, label: Postnumre, widget: list, field: { name: postnr, label: Postnummer, widget: string, pattern: ['^\d{4}$', 'Fire cifre'] } }
              - { name: boligtyper, label: Boligtyper, widget: select, multiple: true, options: [hus, raekkehus, lejlighed, fritidshus, andel] }
              - name: salg_12m
                label: 'Lokale salg de seneste 12 måneder pr. boligtype'
                widget: object
                fields:
                  - { name: hus, label: Huse, widget: string, required: false }
                  - { name: raekkehus, label: Rækkehuse, widget: string, required: false }
                  - { name: lejlighed, label: Lejligheder, widget: string, required: false }
                  - { name: fritidshus, label: Fritidshuse, widget: string, required: false }
                  - { name: andel, label: Andelsboliger, widget: string, required: false }
              - { name: salg_kilde, label: 'Kilde for salg', widget: string }
              - { name: liggetid_dage, label: 'Gennemsnitlig liggetid (dage)', widget: string }
              - name: prisinterval
                label: 'Typisk prisinterval (kr.)'
                widget: object
                fields:
                  - { name: min, label: Fra, widget: string }
                  - { name: max, label: Til, widget: string }
              - { name: kapacitet_dag, label: 'Maks. leads pr. dag', widget: string }
              - { name: kapacitet_maaned, label: 'Maks. leads pr. måned', widget: string }
              - { name: feedback_score, label: 'Feedback-score 0 til 1 (tom = neutral)', widget: number, value_type: float, min: 0, max: 1, required: false }
              - { name: responstid_timer, label: 'Gennemsnitlig responstid (timer, tom = neutral)', widget: number, value_type: float, required: false }
              - { name: trustpilot_score, label: 'Trustpilot-score', widget: string, required: false }

  - name: priser
    label: Kvadratmeterpriser
    files:
      - name: m2
        label: Kvadratmeterpriser pr. postnummer og kommune
        file: data/m2-priser.json
        fields:
          - { name: kilde, label: Kilde, widget: string }
          - { name: dato, label: 'Dato for tallene', widget: string }
          - { name: testdata, label: 'Testdata (vises som Testtal)', widget: boolean, default: false }
          - name: postnumre
            label: Postnumre
            widget: list
            summary: '{{fields.postnr}} {{fields.boligtype}}'
            fields: &m2felter
              - { name: postnr, label: Postnummer, widget: string, required: false }
              - { name: kommunekode, label: Kommunekode, widget: string, required: false }
              - { name: boligtype, label: Boligtype, widget: select, options: [hus, raekkehus, lejlighed, fritidshus] }
              - { name: m2pris, label: 'Kr. pr. m²', widget: string }
              - { name: antal_handler_12m, label: 'Handler de seneste 12 måneder', widget: string }
              - { name: liggetid_dage, label: 'Liggetid (dage)', widget: string }
              - { name: udvikling_1aar_pct, label: 'Prisudvikling 1 år (%)', widget: string }
          - name: kommuner
            label: Kommuner
            widget: list
            summary: '{{fields.kommunekode}} {{fields.boligtype}}'
            fields: *m2felter

  - name: kommuner
    label: Kommunesider
    files:
      - name: kommuner
        label: Kommuner
        file: data/kommuner.json
        fields:
          - { name: kilde, label: Kilde, widget: string }
          - name: kommuner
            label: Kommuner
            widget: list
            summary: '{{fields.navn}}'
            fields:
              - { name: kode, label: Kommunekode, widget: string }
              - { name: navn, label: Navn, widget: string }
              - { name: slug, label: 'Adresse (fx aarhus giver /salgsvurdering/aarhus)', widget: string }
              - { name: naboer, label: 'Nabokommuner (slugs)', widget: list }
              - { name: m2pris_hus, label: 'Kr. pr. m² for huse', widget: string }
              - { name: m2pris_lejlighed, label: 'Kr. pr. m² for lejligheder', widget: string }
              - { name: udvikling_1aar_pct, label: 'Prisudvikling 1 år (%)', widget: string }
              - { name: udvikling_5aar_pct, label: 'Prisudvikling 5 år (%)', widget: string }
              - { name: udvikling_10aar_pct, label: 'Prisudvikling 10 år (%)', widget: string }
              - { name: liggetid_dage, label: 'Liggetid (dage)', widget: string }
              - { name: dato, label: 'Dato for tallene', widget: string }
              - { name: lokal_tekst, label: 'Lokal tekst (valgfri, skrevet til netop denne kommune)', widget: text, required: false }

  - name: indstillinger
    label: Indstillinger
    files:
      - name: site
        label: Firma og kontakt
        file: data/site.json
        fields:
          - { name: navn, label: Navn, widget: string }
          - { name: binavnTekst, label: 'Binavn-tekst', widget: string }
          - { name: selskab, label: Selskab, widget: string }
          - { name: cvr, label: CVR, widget: string }
          - { name: adresse, label: Adresse, widget: string }
          - { name: postnrBy, label: 'Postnr. og by', widget: string }
          - { name: telefon, label: Telefon, widget: string }
          - { name: email, label: E-mail, widget: string }
          - { name: b2bUrl, label: 'Link til Hero Medias side for mæglere', widget: string }
          - { name: samtykkeVersion, label: 'Samtykkeversion (ret ved ændring af samtykketekst)', widget: string }
      - name: marked
        label: Boligmarkedet lige nu
        file: data/marked.json
        fields:
          - { name: kilde, label: Kilde, widget: string }
          - { name: dato, label: Dato, widget: string }
          - { name: m2pris, label: 'Kr. pr. m² for huse', widget: string }
          - { name: liggetid_dage, label: 'Liggetid (dage)', widget: string }
          - { name: handler_12m, label: 'Handler de seneste 12 måneder', widget: string }
          - { name: nedslag_pct, label: 'Gennemsnitligt nedslag (%)', widget: string }
      - name: features
        label: Feature flags
        file: config/features.json
        fields:
          - { name: aktivitet, label: 'Aktivitets-notifikation (kun rigtige leads)', widget: boolean }
          - { name: taeller, label: 'Tæller for antal estimater (kun rigtige tal)', widget: boolean }
          - { name: trustpilot, label: 'Trustpilot TrustBox', widget: boolean }
          - { name: trustpilot_business_unit_id, label: 'Trustpilot business unit id', widget: string }
          - { name: trustpilot_url, label: 'Link til Trustpilot', widget: string }
          - { name: aktivitet_max_alder_timer, label: 'Vis kun aktivitet yngre end (timer)', widget: number }
          - { name: taeller_minimum, label: 'Vis først tælleren fra', widget: number }
      - name: matching
        label: Vægte til matching
        file: config/matching.json
        fields:
          - { name: version, label: 'Version (hæv ved hver ændring)', widget: string }
          - name: vaegte
            label: Vægte
            widget: object
            fields:
              - { name: lokale_salg, label: 'Lokale salg', widget: number, value_type: float }
              - { name: liggetid, label: Liggetid, widget: number, value_type: float }
              - { name: prisniveau, label: Prisniveau, widget: number, value_type: float }
              - { name: feedback, label: Feedback, widget: number, value_type: float }
              - { name: responstid, label: Responstid, widget: number, value_type: float }
          - { name: rotation, label: 'Rotation (lille tal, fx 0.03)', widget: number, value_type: float }
